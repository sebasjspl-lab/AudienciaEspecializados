// ── Cargar guardado automático al iniciar ────────────────────

(function initLoad(){
  try{
    var raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return;
    var saved=JSON.parse(raw);
    Object.keys(saved).forEach(function(k){if(estado.hasOwnProperty(k))estado[k]=saved[k];});
  }catch(e){}
})();

function render(){
  var lista=document.getElementById("lista");
  lista.innerHTML="";
  var totTom=0,gcComp=0;
  DATOS.forEach(function(s,si){
    var tomSec=s.deps.reduce(function(a,d){return a+estado[s.s+"||"+d.d];},0);
    var totalSec=s.deps.reduce(function(a,d){return a+d.t;},0);
    totTom+=tomSec;
    if(tomSec>=totalSec&&totalSec>0)gcComp++;

    g.className="grupo";g.id="g"+si;
    var badge=tomSec+"/"+totalSec;
    var bc=tomSec>=totalSec&&totalSec>0?" completo":"";

      var tom=estado[key];
      var rest=dep.t-tom;
      g.innerHTML+='<div class="dep-row'+(rest===0?" tomada":"")+'" id="r'+si+'_'+di+'">'

function cambiar(si,di,delta){
  var s=DATOS[si];var dep=s.deps[di];
  var key=s.s+"||"+dep.d;
  var nuevo=estado[key]+delta;
  if(nuevo<0||nuevo>dep.t)return;
  estado[key]=nuevo;
  var rest=dep.t-nuevo;
  var row=document.getElementById("r"+si+"_"+di);
  row.className="dep-row"+(rest===0?" tomada":"");
  var vEl=document.getElementById("v"+si+"_"+di);
  vEl.textContent=rest;
  vEl.className="dep-restantes"+(rest===0?" cero":"");
  var btns=row.querySelectorAll(".cbtn");
  btns[0].disabled=rest===0;btns[1].disabled=nuevo===0;
  var tomSec=s.deps.reduce(function(a,d){return a+estado[s.s+"||"+d.d];},0);
  var totalSec=s.deps.reduce(function(a,d){return a+d.t;},0);
  var gb=document.getElementById("gb"+si);
  gb.textContent=tomSec+"/"+totalSec;
  gb.className="grupo-badge"+(tomSec>=totalSec?" completo":"");
  var totTom=0,gcComp=0;
  DATOS.forEach(function(sx){
    var t=sx.deps.reduce(function(a,d){return a+estado[sx.s+"||"+d.d];},0);
    var ts=sx.deps.reduce(function(a,d){return a+d.t;},0);
    totTom+=t;if(t>=ts&&ts>0)gcComp++;
  });
  document.getElementById("s-tom").textContent=totTom;
  document.getElementById("s-disp").textContent=TOTAL-totTom;
  document.getElementById("s-gc").textContent=gcComp;

function toggleGrupo(si){

function setF(f,btn){
  filtro=f;
  document.querySelectorAll(".fbtn").forEach(function(b){b.classList.remove("active");});
  btn.classList.add("active");filtrar();
}

function filtrar(){
  var q=document.getElementById("buscar").value.toLowerCase().trim();
  var vis=0;
  DATOS.forEach(function(s,si){
    var g=document.getElementById("g"+si);if(!g)return;
    var secMatch=s.s.toLowerCase().indexOf(q)!==-1;
    var anyVis=false;
    s.deps.forEach(function(dep,di){
      var row=document.getElementById("r"+si+"_"+di);if(!row)return;
      var key=s.s+"||"+dep.d;
      var tom=estado[key]>0;
      var rest=dep.t-estado[key];
      var dMatch=secMatch||dep.d.toLowerCase().indexOf(q)!==-1;
      var fOk=filtro==="todas"||(filtro==="tom"&&rest===0)||(filtro==="disp"&&rest>0);
      if(dMatch&&fOk){row.classList.remove("hidden");anyVis=true;}
      else row.classList.add("hidden");
    });
    if(anyVis){g.classList.remove("hidden");vis++;}
    else g.classList.add("hidden");
  });
  document.getElementById("vacio").style.display=vis===0?"block":"none";
}

var toastTimer=null;

function mostrarToast(msg,tipo){
  var t=document.getElementById("toast");
  t.textContent=msg;t.className="toast "+(tipo||"");
  void t.offsetWidth;t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove("show");},2500);
}

function guardar(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify(estado));
    var lbl=document.getElementById("autosave-lbl");
    if(lbl){var d=new Date();lbl.textContent="✓ Guardado "+d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");}
  }catch(e){}
}

function guardarManual(){
  guardar();
  mostrarToast("✓ Progreso guardado correctamente","ok");
  var b=document.getElementById("btn-guardar");
  b.classList.add("saved");
  setTimeout(function(){b.classList.remove("saved");},1500);
}

function cargarGuardado(){
  try{
    var raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return;
    var saved=JSON.parse(raw);
    var keys=Object.keys(saved);var loaded=0;
    keys.forEach(function(k){if(estado.hasOwnProperty(k)){estado[k]=saved[k];loaded++;}});
    if(loaded>0)mostrarToast("✓ Progreso anterior restaurado ("+loaded+" entradas)","ok");
  }catch(e){}
}

function exportar(){
  try{
    var data={version:1,fecha:new Date().toISOString(),estado:estado};
    var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    var d=new Date();
    a.href=url;a.download="fgn419_respaldo_"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"_"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+".json";
    a.click();URL.revokeObjectURL(url);
    mostrarToast("✓ Respaldo exportado correctamente","ok");
  }catch(e){mostrarToast("Error al exportar","err");}
}

function importar(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      var src=data.estado||data;
      var keys=Object.keys(src);var loaded=0;
      keys.forEach(function(k){if(estado.hasOwnProperty(k)){estado[k]=src[k];loaded++;}});
      guardar();render();
      mostrarToast("✓ Respaldo importado: "+loaded+" entradas restauradas","ok");
    }catch(ex){mostrarToast("Error: archivo no válido","err");}
    e.target.value="";
  };
  reader.readAsText(file);
}

function resetear(){
  if(!confirm("¿Reiniciar TODOS los conteos? Esta acción también borrará el guardado automático."))return;
  DATOS.forEach(function(s){s.deps.forEach(function(d){estado[s.s+"||"+d.d]=0;});});
  localStorage.removeItem(SAVE_KEY);
  render();mostrarToast("Conteos reiniciados","");
}

render();
</script>
</body>
